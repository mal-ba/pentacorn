<div class="support-overlay-bg" id="support-overlay-bg" hidden></div>
<div class="support-panel" id="support-panel">
  <div class="support-header">
    <div>
      <h4>pentacorn 문의하기</h4>
      <p>자주 묻는 질문에 바로 답해드려요</p>
    </div>
    <button class="support-close-btn" id="support-close-btn" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="support-messages" id="support-messages"></div>
  <div class="support-suggestions" id="support-suggestions"></div>
  <div class="support-input-row">
    <input type="text" id="support-input" placeholder="궁금한 걸 물어보세요 (예: 결제, 로그인, 스캔...)">
    <button id="support-send-btn" type="button">전송</button>
  </div>
</div>

<div class="credits-overlay" id="credits-overlay" hidden>
  <div class="credits-scroll" id="credits-scroll"></div>
  <button class="credits-close-btn" id="credits-close-btn" type="button" aria-label="닫기">✕</button>
</div>
