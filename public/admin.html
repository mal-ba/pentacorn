<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — UNEXPOSED 주문 관리</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --deep:#0F2E2C; --mist:#F5F2EA; --paper:#FBFAF6; --ink:#14201E; --ink-soft:#4A5654;
    --line:rgba(20,32,30,0.12); --star-dark:#3E7F86; --coral:#D8663F;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink);
    margin:0; padding:24px; line-height:1.6;
  }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:24px; margin:0 0 6px; }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:20px; }
  .top-bar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  .status-box{
    max-width:560px; margin:60px auto; text-align:center; padding:32px; border:1px solid var(--line);
    border-radius:16px; background:var(--mist);
  }
  .status-box p{ color:var(--ink-soft); font-size:14px; margin:10px 0 18px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--paper); }
  th, td{ padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th{ background:var(--mist); font-weight:600; position:sticky; top:0; }
  td.wrap{ white-space:normal; max-width:260px; }
  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .badge-paid{ background:#DCEFE7; color:#1F7A52; }
  .badge-pending{ background:#F5E6C8; color:#8A6417; }
  .refresh-btn, .logout-btn{
    padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper);
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .refresh-btn:hover, .logout-btn:hover{ border-color:var(--star-dark); }
  .empty-note{ padding:40px; text-align:center; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>

<div id="login-view" class="status-box">
  <h1>관리자 로그인</h1>
  <p>주문·배송지 정보를 보려면 관리자로 등록된 Google 계정으로 로그인해주세요.</p>
  <div id="g_id_onload"
       data-client_id="%%GOOGLE_CLIENT_ID%%"
       data-callback="handleAdminCredential"
       data-auto_prompt="false">
  </div>
  <div class="g_id_signin" style="display:flex; justify-content:center;"
       data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="pill">
  </div>
</div>

<div id="denied-view" class="status-box" hidden>
  <h1>접근 권한이 없어요</h1>
  <p id="denied-text">이 계정은 관리자로 등록되어 있지 않아요. 관리자 이메일로 다시 로그인해주세요.</p>
  <button class="logout-btn" id="denied-logout-btn" type="button">다른 계정으로 로그인</button>
</div>

<div id="dashboard-view" hidden>
  <div class="top-bar">
    <div>
      <h1>UNEXPOSED 주문 관리</h1>
      <p class="sub" id="admin-email-text"></p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="refresh-btn" id="refresh-btn" type="button">새로고침</button>
      <button class="logout-btn" id="logout-btn" type="button">로그아웃</button>
    </div>
  </div>

  <div class="table-scroll">
    <table id="orders-table">
      <thead>
        <tr>
          <th>주문일시</th>
          <th>상태</th>
          <th>주문자 이메일</th>
          <th>옵션</th>
          <th>금액</th>
          <th>받는 분</th>
          <th>연락처</th>
          <th>배송지</th>
          <th>배송 메모</th>
        </tr>
      </thead>
      <tbody id="orders-tbody"></tbody>
    </table>
    <div class="empty-note" id="orders-empty" hidden>아직 주문이 없어요.</div>
  </div>
</div>

<script>
  const loginView = document.getElementById('login-view');
  const deniedView = document.getElementById('denied-view');
  const dashboardView = document.getElementById('dashboard-view');
  const adminEmailText = document.getElementById('admin-email-text');
  const ordersTbody = document.getElementById('orders-tbody');
  const ordersEmpty = document.getElementById('orders-empty');
  const ordersTable = document.getElementById('orders-table');

  function showView(view){
    loginView.hidden = view !== 'login';
    deniedView.hidden = view !== 'denied';
    dashboardView.hidden = view !== 'dashboard';
  }

  function fmtWon(n){
    return Number(n || 0).toLocaleString('ko-KR') + '원';
  }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function renderOrders(orders){
    if(!orders || orders.length === 0){
      ordersTable.hidden = true;
      ordersEmpty.hidden = false;
      return;
    }
    ordersTable.hidden = false;
    ordersEmpty.hidden = true;
    ordersTbody.innerHTML = orders.map(o => {
      const optionParts = [o.fabric_label, ...(o.detail_labels || []), o.finish_label].filter(Boolean).join(' · ');
      const address = [o.shipping_address1, o.shipping_address2].filter(Boolean).join(' ');
      const statusBadge = o.status === 'paid'
        ? '<span class="badge badge-paid">결제완료</span>'
        : '<span class="badge badge-pending">대기중</span>';
      return `
        <tr>
          <td>${fmtDate(o.created_at)}</td>
          <td>${statusBadge}</td>
          <td>${o.email || ''}</td>
          <td class="wrap">${optionParts || '-'}</td>
          <td>${fmtWon(o.amount)}</td>
          <td>${o.shipping_name || '-'}</td>
          <td>${o.shipping_phone || '-'}</td>
          <td class="wrap">${address ? `(${o.shipping_zipcode || ''}) ${address}` : '-'}</td>
          <td class="wrap">${o.shipping_note || '-'}</td>
        </tr>`;
    }).join('');
  }

  async function loadOrders(){
    try{
      const res = await fetch('/api/admin/orders');
      const data = await res.json();
      if(!data.ok){
        showView('denied');
        return;
      }
      renderOrders(data.orders);
    } catch(err){
      ordersEmpty.hidden = false;
      ordersEmpty.textContent = '주문 목록을 불러오지 못했어요.';
    }
  }

  async function checkAdminAndLoad(){
    try{
      const meRes = await fetch('/api/me');
      const me = await meRes.json();
      if(!me.user){
        showView('login');
        return;
      }
      const adminRes = await fetch('/api/admin/me');
      const adminData = await adminRes.json();
      if(!adminData.ok){
        showView('denied');
        return;
      }
      adminEmailText.textContent = `${me.user.name} (${me.user.email}) 로 로그인됨`;
      showView('dashboard');
      loadOrders();
    } catch(err){
      showView('login');
    }
  }

  window.handleAdminCredential = async function(response){
    try{
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if(data.ok){
        checkAdminAndLoad();
      } else {
        alert(data.error || '로그인에 실패했어요.');
      }
    } catch(err){
      alert('로그인 중 오류가 발생했어요.');
    }
  };

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.reload();
  });
  document.getElementById('denied-logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.reload();
  });

  checkAdminAndLoad();
</script>
</body>
</html>
