<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커뮤니티 — UNEXPOSED</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0F2E2C; --deep-2:#123B38; --mist:#F5F2EA; --paper:#FBFAF6; --star:#6FB8C2; --star-dark:#3E7F86;
    --coral:#D8663F; --ink:#14201E; --ink-soft:#4A5654; --line:rgba(20,32,30,0.12); --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink); margin:0; line-height:1.7;
  }
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:rgba(251,250,246,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; text-decoration:none; color:var(--ink); }
  .brand svg{ width:24px; height:24px; }
  .back-link{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--star-dark); }
  main{ max-width:920px; margin:0 auto; padding:56px 6vw 100px; }
  .eyebrow{ font-size:12.5px; letter-spacing:0.08em; color:var(--star-dark); font-weight:700; margin-bottom:10px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(28px,4vw,38px); margin:0 0 14px; }
  .intro{ color:var(--ink-soft); font-size:15.5px; margin:0 0 32px; max-width:640px; }
  .nav-left{ display:flex; align-items:center; gap:14px; }
  .menu-toggle-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .menu-toggle-btn:hover{ border-color:var(--star-dark); }
  .upload-open-btn{
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    border-radius:999px; border:1px solid var(--deep); background:var(--deep); color:var(--paper);
    padding:9px 16px; flex-shrink:0;
  }
  .upload-open-btn:hover{ background:var(--deep-2); }

  /* ---------- 작품 올리기 모달 ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,32,30,0.55); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-box{
    background:var(--paper); border-radius:var(--radius); padding:28px 26px; max-width:460px; width:100%;
    max-height:88vh; overflow-y:auto; position:relative;
  }
  .modal-box h2{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0 0 10px; }
  .modal-close-btn{
    position:absolute; top:18px; right:18px; width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer;
  }
  .login-note{ font-size:13.5px; color:var(--ink-soft); }
  .login-note a{ color:var(--star-dark); font-weight:600; }
  .upload-form{ display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .upload-form input[type="text"], .upload-form textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper); outline:none;
  }
  .upload-form textarea{ min-height:70px; resize:vertical; }
  .upload-form input[type="text"]:focus, .upload-form textarea:focus{ border-color:var(--star-dark); }
  .file-label{
    display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    cursor:pointer; border:1px dashed var(--star-dark); background:var(--mist); color:var(--star-dark);
  }
  .file-label:hover{ background:var(--line); }
  .file-preview{ margin-top:2px; }
  .file-preview img{ max-width:140px; max-height:140px; border-radius:10px; border:1px solid var(--line); display:block; }
  .upload-submit-btn{
    align-self:flex-start; padding:11px 22px; border-radius:999px; border:none;
    background:var(--deep); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .upload-submit-btn:hover{ opacity:0.9; }
  .upload-submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .upload-note{ font-size:12.5px; color:var(--star-dark); font-weight:600; min-height:16px; }

  /* ---------- 갤러리 ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px;
  }
  @media(min-width:640px){ .gallery-grid{ grid-template-columns:repeat(3,1fr); } }
  .post-card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper);
    display:flex; flex-direction:column;
  }
  .post-card img{ width:100%; aspect-ratio:1; object-fit:cover; background:var(--mist); }
  .post-card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .post-card-title{ font-size:13.5px; font-weight:700; }
  .post-card-desc{ font-size:12px; color:var(--ink-soft); line-height:1.5; flex:1; }
  .post-card-meta{ font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .post-delete-btn{
    font-family:inherit; font-size:11px; color:var(--coral); background:none; border:none; cursor:pointer; padding:0;
  }
  .post-delete-btn:hover{ text-decoration:underline; }
  .empty-note{ font-size:14px; color:var(--ink-soft); padding:30px 0; text-align:center; }
</style>
</head>
<body>

<header>
  <div class="nav-left">
    <button class="menu-toggle-btn" id="menu-toggle-btn" type="button" aria-label="메뉴 열기">
      <svg viewBox="0 0 20 14" width="20" height="14"><rect width="20" height="2" rx="1" fill="currentColor"/><rect y="6" width="20" height="2" rx="1" fill="currentColor"/><rect y="12" width="20" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <a class="brand" href="/">
      <svg viewBox="0 0 100 100"><polygon points="50,4 91,35 75,90 25,90 9,35" fill="#0F2E2C"/><polygon points="50,20 78,42 67,80 33,80 22,42" fill="#F5F2EA"/></svg>
      UNEXPOSED
    </a>
  </div>
  <button class="upload-open-btn" id="upload-open-btn" type="button">작품 올리기</button>
</header>

<div id="side-menu-mount"></div>

<div class="modal-overlay" id="upload-modal" hidden>
  <div class="modal-box">
    <button class="modal-close-btn" id="upload-close-btn" type="button" aria-label="닫기">✕</button>
    <h2>내 작품 올리기</h2>
    <p class="login-note" id="login-note">로그인 후 이용할 수 있어요 — 왼쪽 상단 메뉴에서 로그인해주세요.</p>
    <form class="upload-form" id="upload-form" hidden>
      <input type="text" id="post-title-input" placeholder="제목 (예: 여름용 원피스 코디)" maxlength="80" required>
      <textarea id="post-desc-input" placeholder="설명(선택) — 어떤 원단·무늬를 썼는지 등" maxlength="500"></textarea>
      <label class="file-label" for="post-image-input">이미지 선택 <input type="file" id="post-image-input" accept="image/*" hidden></label>
      <div class="file-preview" id="post-image-preview"></div>
      <button class="upload-submit-btn" id="post-submit-btn" type="submit" disabled>올리기</button>
      <p class="upload-note" id="upload-note"></p>
    </form>
  </div>
</div>

<main>
  <div class="eyebrow">COMMUNITY</div>
  <h1>사람들이 만든 작품들</h1>
  <p class="intro">직접 디자인한 옷·아이템 스크린샷을 올려서 다른 사람들에게 자랑해보세요. 오른쪽 위 "작품 올리기"를 눌러서 올릴 수 있어요 (로그인 필요).</p>

  <div class="gallery-grid" id="gallery-grid"></div>
  <p class="empty-note" id="gallery-empty" hidden>아직 올라온 작품이 없어요. 첫 번째로 올려보세요!</p>
</main>

<script src="/menu-loader.js"></script>
<script>
  const loginNote = document.getElementById('login-note');
  const uploadForm = document.getElementById('upload-form');
  const titleInput = document.getElementById('post-title-input');
  const descInput = document.getElementById('post-desc-input');
  const imageInput = document.getElementById('post-image-input');
  const imagePreview = document.getElementById('post-image-preview');
  const submitBtn = document.getElementById('post-submit-btn');
  const uploadNote = document.getElementById('upload-note');
  const galleryGrid = document.getElementById('gallery-grid');
  const galleryEmpty = document.getElementById('gallery-empty');

  let me = null; // 로그인한 사람 정보 (없으면 null)

  const uploadOpenBtn = document.getElementById('upload-open-btn');
  const uploadModal = document.getElementById('upload-modal');
  const uploadCloseBtn = document.getElementById('upload-close-btn');
  uploadOpenBtn.addEventListener('click', () => { uploadModal.hidden = false; });
  uploadCloseBtn.addEventListener('click', () => { uploadModal.hidden = true; });
  uploadModal.addEventListener('click', e => { if(e.target === uploadModal) uploadModal.hidden = true; });

  async function checkLogin(){
    try{
      const res = await fetch('/api/me');
      const data = await res.json();
      if(data.user){
        me = data.user;
        loginNote.hidden = true;
        uploadForm.hidden = false;
      }
    } catch(err){ /* 로그인 안 한 상태로 취급 */ }
  }

  function updateSubmitState(){
    submitBtn.disabled = !(titleInput.value.trim() && imageInput.files[0]);
  }
  titleInput.addEventListener('input', updateSubmitState);
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    imagePreview.innerHTML = '';
    if(file){
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      imagePreview.appendChild(img);
    }
    updateSubmitState();
  });

  uploadForm.addEventListener('submit', async e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '올리는 중...';
    uploadNote.textContent = '';
    try{
      const formData = new FormData();
      formData.append('title', titleInput.value.trim());
      formData.append('description', descInput.value.trim());
      formData.append('image', imageInput.files[0]);
      const res = await fetch('/api/community/posts', { method: 'POST', body: formData });
      const data = await res.json();
      if(data.ok){
        titleInput.value = '';
        descInput.value = '';
        imageInput.value = '';
        imagePreview.innerHTML = '';
        uploadNote.textContent = '올렸어요!';
        loadPosts();
        setTimeout(() => { uploadModal.hidden = true; uploadNote.textContent = ''; }, 1000);
      } else {
        uploadNote.textContent = data.error || '올리기에 실패했어요.';
      }
    } catch(err){
      uploadNote.textContent = '올리는 중 오류가 발생했어요.';
    } finally {
      submitBtn.textContent = '올리기';
      updateSubmitState();
    }
  });

  function fmtDate(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderPosts(posts){
    if(posts.length === 0){
      galleryGrid.innerHTML = '';
      galleryEmpty.hidden = false;
      return;
    }
    galleryEmpty.hidden = true;
    galleryGrid.innerHTML = posts.map(p => `
      <div class="post-card" data-id="${p.id}">
        <img src="${p.imageUrl}" alt="${(p.title || '').replace(/"/g, '&quot;')}" loading="lazy">
        <div class="post-card-body">
          <div class="post-card-title">${p.title}</div>
          ${p.description ? `<div class="post-card-desc">${p.description}</div>` : ''}
          <div class="post-card-meta">
            <span>${p.authorName || '익명'} · ${fmtDate(p.createdAt)}</span>
            ${(me && (me.email === p.authorEmail)) ? `<button class="post-delete-btn" data-post-id="${p.id}" type="button">삭제</button>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  async function loadPosts(){
    try{
      const res = await fetch('/api/community/posts');
      const data = await res.json();
      if(data.ok) renderPosts(data.posts);
    } catch(err){ /* 조용히 실패해도 괜찮아요 */ }
  }

  galleryGrid.addEventListener('click', async e => {
    const btn = e.target.closest('.post-delete-btn');
    if(!btn) return;
    if(!confirm('이 게시물을 삭제할까요?')) return;
    try{
      const res = await fetch(`/api/community/posts/${btn.dataset.postId}`, { method: 'DELETE' });
      const data = await res.json();
      if(data.ok) loadPosts();
      else alert(data.error || '삭제에 실패했어요.');
    } catch(err){
      alert('삭제 중 오류가 발생했어요.');
    }
  });

  checkLogin();
  loadPosts();
</script>
</body>
</html>
