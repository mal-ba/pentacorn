<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>협력 업체 — UNEXPOSED</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0F2E2C; --mist:#F5F2EA; --paper:#FBFAF6; --star:#6FB8C2; --star-dark:#3E7F86;
    --coral:#D8663F; --ink:#14201E; --ink-soft:#4A5654; --line:rgba(20,32,30,0.12); --radius:18px;
  }
  *{box-sizing:border-box;}
  body{ font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink); margin:0; line-height:1.7; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 6vw; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; text-decoration:none; color:var(--ink); }
  .brand svg{ width:24px; height:24px; }
  .back-link{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--star-dark); }
  main{ max-width:640px; margin:0 auto; padding:56px 6vw 100px; text-align:center; }
  .eyebrow{ font-size:12.5px; letter-spacing:0.08em; color:var(--star-dark); font-weight:700; margin-bottom:10px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(26px,4vw,34px); margin:0 0 28px; }
  .empty-box{
    border:2px dashed var(--line); border-radius:var(--radius); padding:48px 24px; margin-bottom:24px;
  }
  p{ color:var(--ink-soft); font-size:15px; margin:0 0 14px; text-align:left; }
</style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <svg viewBox="0 0 100 100"><polygon points="50,4 91,35 75,90 25,90 9,35" fill="#0F2E2C"/><polygon points="50,20 78,42 67,80 33,80 22,42" fill="#F5F2EA"/></svg>
    UNEXPOSED
  </a>
  <a class="back-link" href="/">← 홈으로</a>
</header>

<main>
  <div class="eyebrow">PARTNERS</div>
  <h1>아직은, 우리 팀이 전부예요</h1>

  <div class="empty-box">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="rgba(20,32,30,0.28)" stroke-width="1.5">
      <path d="M8 12l3 3 6-6"/><circle cx="12" cy="12" r="9"/>
    </svg>
  </div>

  <p>현재는 협력하고 있는 원단·제작·배송 업체가 없어요.</p>
  <p>지금은 PentaCorp 팀 6명이 직접 데모를 운영하며 기능을 테스트하는 단계예요. 정식 서비스 출시 시 원단·재단·배송 파트너사와 협력할 예정이고, 정해지는 대로 이 페이지에 안내해드릴게요.</p>
</main>

</body>
</html>
