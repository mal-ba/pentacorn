<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 처리 중 — pentacorn</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Noto Sans KR', sans-serif; background:#FBFAF6; color:#14201E;
    display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px;
  }
  .box{ max-width:420px; text-align:center; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:24px; margin-bottom:14px; }
  p{ color:#4A5654; font-size:14.5px; line-height:1.6; margin-bottom:24px; }
  .spinner{
    width:34px; height:34px; border:3px solid #DDE5E3; border-top-color:#3E7F86;
    border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.btn{
    display:inline-block; margin-top:8px; padding:12px 26px; border-radius:999px;
    background:#0F2E2C; color:#FBFAF6; text-decoration:none; font-size:14px; font-weight:600;
  }
  .error{ color:#D8663F; font-weight:600; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">결제를 확인하고 있어요</h1>
    <p id="message">잠시만 기다려주세요...</p>
    <a class="btn" href="/#pricing" id="back-link" hidden>요금제 페이지로 돌아가기</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const paymentKey = params.get('paymentKey');
  const orderId = params.get('orderId');
  const amount = params.get('amount');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const spinner = document.getElementById('spinner');
  const backLink = document.getElementById('back-link');

  async function confirmPayment(){
    if(!paymentKey || !orderId || !amount){
      spinner.hidden = true;
      title.textContent = '결제 정보를 찾을 수 없어요';
      message.innerHTML = '<span class="error">필요한 결제 정보가 없어요. 다시 시도해주세요.</span>';
      backLink.hidden = false;
      return;
    }
    // orderId가 "order_"로 시작하면 맞춤 제작 주문(배송 포함), 아니면 구독 결제예요.
    const isCustomOrder = orderId.startsWith('order_');
    const endpoint = isCustomOrder ? '/api/orders/confirm' : '/api/payments/confirm';
    try{
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
      });
      const data = await res.json();
      spinner.hidden = true;
      if(data.ok){
        if(isCustomOrder){
          title.textContent = '주문이 접수됐어요 🎉';
          message.textContent = data.needsShipping
            ? '결제가 완료됐고, 입력하신 배송지로 제작 완료 후 보내드릴게요.'
            : '결제가 완료됐어요. 선택하신 패턴 PDF는 이메일로 안내드릴게요.';
        } else {
          title.textContent = '결제가 완료됐어요 🎉';
          message.textContent = `${data.plan} 플랜 구독이 시작됐어요. 매월 ${Number(data.amount).toLocaleString('ko-KR')}원이 결제될 예정이에요.`;
        }
      } else {
        title.textContent = '결제 승인에 실패했어요';
        message.innerHTML = `<span class="error">${data.error || '알 수 없는 오류가 발생했어요.'}</span>`;
      }
    } catch(err){
      spinner.hidden = true;
      title.textContent = '오류가 발생했어요';
      message.innerHTML = '<span class="error">서버와 통신하는 중 문제가 생겼어요.</span>';
    }
    backLink.hidden = false;
  }
  confirmPayment();
</script>
</body>
</html>
